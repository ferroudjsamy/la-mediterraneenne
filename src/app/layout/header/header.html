<header class="header">
  <a class="header__logo" routerLink="/">
    <img src="/images/logo-transparent.webp" alt="Boucherie-Épicerie La Méditerranéenne - Accueil" width="640" height="333">
  </a>

  <nav class="header__nav desktop-only" aria-label="Navigation principale">
    <ul class="header__liens">
      <li><a routerLink="/" routerLinkActive="actif" [routerLinkActiveOptions]="{ exact: true }">Accueil</a></li>
      <li><a routerLink="/rayons" routerLinkActive="actif">Nos rayons</a></li>
      <li><a routerLink="/a-propos" routerLinkActive="actif">À propos</a></li>
      <li><a routerLink="/contact" routerLinkActive="actif">Contact</a></li>
    </ul>
  </nav>

  <a class="btn btn--plein desktop-only" href="tel:+15145502554">
    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    Appeler
  </a>

  <button class="header__burger mobile-only" type="button" aria-label="Ouvrir le menu" aria-expanded="false">
    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
  </button>
</header>
