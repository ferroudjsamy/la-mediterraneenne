<section class="infos" id="infos">
  <div class="infos__bloc">
    <p class="surtitre surtitre--clair infos__surtitre">Infos pratiques</p>
    <h2 class="infos__titre">Passez nous <span class="infos__accent">voir</span></h2>

    <ul class="infos__liste">
      <li class="infos__ligne">
        <svg class="infos__icone" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        <address>2554, chemin de Chambly, Longueuil</address>
      </li>
      <li class="infos__ligne">
        <svg class="infos__icone" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
        <div>
          <p>
            Lun. au ven. · 9 h à 19 h 30<br>
            Sam. et dim. · 9 h à 19 h
          </p>
          <p class="infos__statut" [class.infos__statut--ferme]="!ouvert()">
            {{ ouvert() ? 'Ouvert maintenant' : 'Fermé' }}
          </p>
        </div>
      </li>
    </ul>

    <div class="infos__actions">
      <a class="btn btn--plein" href="tel:+15145502554">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Appeler
      </a>
      <a class="btn btn--contour" href="https://maps.app.goo.gl/rCFUay6EGj3kr5mm6" target="_blank" rel="noopener">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        Itinéraire
      </a>
    </div>
  </div>

  <div class="infos__plan">
    <iframe
      title="Plan d'accès à La Méditerranéenne"
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2467.4487042786836!2d-73.47060632844982!3d45.52350745720427!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4cc904b916228ae9%3A0x252a8c3b737e9db6!2sBoucherie%20%26%20%C3%89picerie%20La%20M%C3%A9diterran%C3%A9enne%20Halal!5e0!3m2!1sfr!2sca!4v1795148296861!5m2!1sfr!2sca"
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </div>
</section>
